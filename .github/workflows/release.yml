name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build self-contained installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/shell

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      - name: Install shell dependencies
        run: npm ci

      # Host runtime: official npm packages, pinned. Reproducible and auditable.
      - name: Install Harness host
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci/host | Out-Null
          '{ "name": "host-vendor", "private": true }' | Set-Content .ci/host/package.json -Encoding utf8
          npm install --prefix .ci/host --omit=dev --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
          if (-not (Test-Path .ci/host/node_modules/@deepseek-ai/dsh/lib/bin.js)) {
            throw 'host package did not install correctly'
          }

      # Node runtime: community Windows 7 build (official Node 22 requires Win10).
      - name: Fetch Node 22 for Windows 7
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $url = 'https://github.com/DeftKing/nodejs-win7/raw/main/node-22.23.3/node-v22.23.3-win-x64.7z'
          Invoke-WebRequest -Uri $url -OutFile node22.7z
          $sevenZip = @(
            'C:\Program Files\7-Zip\7z.exe',
            'C:\Program Files (x86)\7-Zip\7z.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZip) { $sevenZip = '7z' }
          & $sevenZip x node22.7z -onode22 -y | Out-Null
          $nodeExe = Get-ChildItem node22 -Recurse -Filter node.exe | Select-Object -First 1
          if (-not $nodeExe) { throw 'node runtime extraction failed' }

      - name: Prepare vendor (node + host)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ./scripts/prepare-vendor.ps1 -NodeDir ./node22 -HostDir ./.ci/host
          $bin = 'apps/shell/vendor/host/node_modules/@deepseek-ai/dsh/lib/bin.js'
          if (-not (Test-Path $bin)) { throw "missing $bin" }

      - name: Build installer and portable exe
        run: npm run dist

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/shell/dist/Harness7-*-setup.exe
            apps/shell/dist/Harness7-*-portable.exe
            apps/shell/dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
